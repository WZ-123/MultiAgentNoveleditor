<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>授权验证</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; background: #1e1e1e; color: #ccc; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: 350px; padding: 24px; }
    h1 { margin: 0 0 8px; color: #fff; font-size: 17px; }
    p { margin: 0 0 16px; color: #999; line-height: 1.55; }
    input { width: 100%; padding: 9px 12px; border: 1px solid #444; border-radius: 5px; outline: none; background: #252526; color: #ddd; font: inherit; }
    input:focus { border-color: #3794ff; }
    #error { min-height: 34px; padding-top: 8px; color: #f48771; line-height: 1.4; }
    footer { display: flex; justify-content: flex-end; gap: 8px; }
    button { padding: 7px 17px; border: 0; border-radius: 5px; cursor: pointer; background: #3c3c3c; color: #ddd; }
    button.primary { background: #007acc; color: #fff; }
    button:disabled { cursor: wait; opacity: .55; }
  </style>
</head>
<body>
  <main>
    <h1>授权验证</h1>
    <p>请输入授权码。验证凭据只保存在系统安全存储中，不会写入项目配置。</p>
    <input id="auth-code" type="password" autocomplete="off" maxlength="256" placeholder="授权码" autofocus>
    <div id="error" role="alert" aria-live="polite"></div>
    <footer>
      <button id="quit" type="button">退出</button>
      <button id="verify" class="primary" type="button">验证</button>
    </footer>
  </main>
  <script src="auth-dialog-renderer.js"></script>
</body>
</html>
